<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Inscrição - Escola de Programação</title>
</head>

<body>

    <h1>Inscrição para curso de programação</h1>

    <form action="/cadastro" method="post">

        <!-- Dados pessoais -->
        <fieldset>

            <legend>Dados pessoais</legend>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <br><br>

            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required>

            <br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required>

            <br><br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" minlength="8" required>

            <br><br>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" required>

            <br><br>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" placeholder="Digite sua idade" min="14" max="100" required>

            <br><br>

            <label for="data_nascimento">Data de nascimento:</label>
            <input type="date" id="data_nascimento" name="data_nascimento" required>

        </fieldset>

        <br>

        <!-- Informações do curso -->
        <fieldset>

            <legend>Informações do curso</legend>

            <label for="curso">Curso:</label>

            <select id="curso" name="curso" required>

                <option value="">Selecione seu curso</option>
                <option value="html-css">HTML e CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="banco-dados">Banco de Dados</option>

            </select>

            <br><br>

            <p>Modalidade:</p>

            <input type="radio" id="presencial" name="modalidade" value="presencial" required>
            <label for="presencial">Presencial</label>

            <br>

            <input type="radio" id="online" name="modalidade" value="online">
            <label for="online">Online</label>

            <br><br>

            <p>Turno:</p>

            <input type="radio" id="manha" name="turno" value="manha" required>
            <label for="manha">Manhã</label>

            <br>

            <input type="radio" id="tarde" name="turno" value="tarde">
            <label for="tarde">Tarde</label>

            <br>

            <input type="radio" id="noite" name="turno" value="noite">
            <label for="noite">Noite</label>

            <br><br>

            <label for="nivel">Nível de conhecimento:</label>

            <br>

            <select id="nivel" name="nivel" required>

                <option value="">Selecione seu nível</option>
                <option value="iniciante">Iniciante</option>
                <option value="intermediario">Intermediário</option>
                <option value="avancado">Avançado</option>

            </select>

        </fieldset>

        <br>

        <!-- Conhecimentos -->
        <fieldset>

            <legend>Conhecimentos</legend>

            <p>Quais tecnologias você já conhece?</p>

            <input type="checkbox" id="html" name="tecnologias" value="html">
            <label for="html">HTML</label>

            <br>

            <input type="checkbox" id="css" name="tecnologias" value="css">
            <label for="css">CSS</label>

            <br>

            <input type="checkbox" id="javascript" name="tecnologias" value="javascript">
            <label for="javascript">JavaScript</label>

            <br>

            <input type="checkbox" id="python" name="tecnologias" value="python">
            <label for="python">Python</label>

            <br>

            <input type="checkbox" id="java" name="tecnologias" value="java">
            <label for="java">Java</label>

            <br>

            <input type="checkbox" id="csharp" name="tecnologias" value="csharp">
            <label for="csharp">C#</label>

        </fieldset>

        <br>

        <!-- Localização -->
        <fieldset>

            <legend>Localização</legend>

            <label for="estado">Estado:</label>

            <br>

            <select id="estado" name="estado" required>

                <option value="">Selecione seu estado</option>
                <option value="sp">São Paulo</option>
                <option value="rj">Rio de Janeiro</option>
                <option value="mg">Minas Gerais</option>
                <option value="pr">Paraná</option>
                <option value="ba">Bahia</option>

            </select>

            <br><br>

            <label for="cidade">Cidade:</label>

            <br>

            <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" required>

        </fieldset>

        <br>


        <fieldset>

            <legend>Informações adicionais</legend>

            <label for="motivo">
                Por que você deseja fazer este curso?
            </label>

            <br>

            <textarea id="motivo" name="motivo" placeholder="Digite o motivo..." rows="5" minlength="20"
                required></textarea>

            <br><br>

            <input type="checkbox" id="termos" name="termos" value="aceito" required>

            <label for="termos">
                Aceito os termos de inscrição
            </label>

        </fieldset>

        <br><br>

        <button type="submit">Cadastrar</button>

        <button type="reset">Limpar</button>

    </form>

</body>

</html>
